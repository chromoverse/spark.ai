[project]
name = "spark-body"
version = "0.1.0"
description = "Spark v2 device sidecar: ear, mouth, hands, fitness, watchdog (stdio JSON-RPC)"
requires-python = ">=3.11,<3.13"
# The core is stdlib-only. Engines and hands are optional extras: an engine whose extra isn't
# installed simply fails its fitness probe and stays out of the plan (REDESIGN §18).
dependencies = []

[project.optional-dependencies]
tts = ["edge-tts>=7.0"]
audio = ["sounddevice>=0.5", "numpy>=1.26"]
hands = ["pycaw>=20240210; sys_platform == 'win32'", "screen-brightness-control>=0.24"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
