<style>
  :root {
    --bg: #161512;
    --bg-2: #1c1b17;
    --bg-3: #232118;
    --line: #2a2822;
    --line-2: #34312a;
    --ink: #ece6da;
    --ink-2: #b8b1a3;
    --ink-3: #7a7468;
    --ink-4: #524d44;
    --accent: #d97757;       /* Claude orange */
    --accent-2: #c2643f;
    --accent-soft: rgba(217,119,87,0.12);
    --ok: #7fb685;
    --ok-soft: rgba(127,182,133,0.12);
    --warn: #d4a04a;
    --err: #c97064;
    --err-soft: rgba(201,112,100,0.10);
    --info: #87a7c4;
    --info-soft: rgba(135,167,196,0.10);
    --user-tint: #e9d9c2;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    font-feature-settings: 'ss01', 'cv11';
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  .serif { font-family: 'Instrument Serif', Georgia, serif; }

  ::selection { background: var(--accent-soft); color: var(--ink); }

  /* Scrollbar */
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 2px solid var(--bg); }
  *::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }

  /* Subtle grain on background */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
    z-index: 0;
  }
</style>
</head>

<div id="root"></div>

</body>
