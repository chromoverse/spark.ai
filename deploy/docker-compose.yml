# Local dev stack. Everything binds to 127.0.0.1; nothing here is exposed to the network.
#   docker compose -f deploy/docker-compose.yml up -d            # brain + postgres + redis + searxng
#   docker compose -f deploy/docker-compose.yml up -d postgres redis searxng   # run the brain with uv instead
name: spark

services:
  brain:
    build: ../brain
    env_file:
      - path: .env
        required: false
    environment:
      # Service names inside the compose network override the 127.0.0.1 values in .env.
      DATABASE_URL: postgresql+asyncpg://spark:${POSTGRES_PASSWORD:-spark}@postgres:5432/spark
      REDIS_URL: redis://redis:6379/0
      SEARXNG_URL: http://searxng:8080
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spark}
      POSTGRES_DB: spark
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d spark"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-dev-only-change-me}
    ports: ["127.0.0.1:8888:8080"]
    volumes: [./searxng/settings.yml:/etc/searxng/settings.yml:ro]

  # Stub until R7: HTTPS in front of the brain. Dev talks to the brain directly on 127.0.0.1:8080.
  #   docker compose -f deploy/docker-compose.yml --profile tls up -d caddy
  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    environment:
      BRAIN_DOMAIN: ${BRAIN_DOMAIN:-localhost}
    ports: ["127.0.0.1:443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro]
    depends_on: [brain]

volumes:
  pgdata:
  redisdata:
